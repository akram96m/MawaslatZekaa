name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract game ZIP
        run: |
          mkdir -p game
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d game

      - name: Find index.html
        run: |
          INDEX=$(find game -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "لم يتم العثور على index.html داخل ZIP"
            exit 1
          fi

          echo "Found: $INDEX"

          mkdir -p www

          ROOT=$(dirname "$INDEX")
          cp -r "$ROOT"/* www/

      - name: Create Capacitor project
        run: |
          npm init -y

          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "مواصلات ذكاء" "com.mawaslat.zekaa" --web-dir www

          npx cap add android

          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MawaslatZekaa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
