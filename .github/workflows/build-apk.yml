name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Extract game ZIP
        run: |
          mkdir -p game

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "الملف الرئيسي: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d game

          # فك ملفات ZIP الموجودة داخل ZIP
          for i in 1 2 3 4 5; do
            INNER_ZIPS=$(find game -type f -name "*.zip")

            if [ -z "$INNER_ZIPS" ]; then
              break
            fi

            echo "فك ملفات ZIP الداخلية..."

            while IFS= read -r INNER; do
              DIR=$(dirname "$INNER")
              echo "فك: $INNER"
              unzip -o "$INNER" -d "$DIR"
              rm -f "$INNER"
            done <<< "$INNER_ZIPS"
          done

          echo "محتويات اللعبة:"
          find game -type f | head -200
        run: |
          mkdir -p game
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d game
      - name: Find HTML file
        run: |
          HTML=$(find game -type f \( -iname "*.html" -o -iname "*.htm" \) | head -n 1)

          if [ -z "$HTML" ]; then
            echo "لم يتم العثور على أي ملف HTML داخل ZIP"
            echo "محتويات ZIP:"
            find game -type f | head -100
            exit 1
          fi

          echo "تم العثور على: $HTML"

          ROOT=$(dirname "$HTML")

          mkdir -p www
          cp -r "$ROOT"/* www/

          echo "محتويات www:"
          find www -maxdepth 2 -type f | head -100

      - name: Create Capacitor project
        run: |
          npm init -y

          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "مواصلات ذكاء" "com.mawaslat.zekaa" --web-dir www

          npx cap add android

          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MawaslatZekaa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
